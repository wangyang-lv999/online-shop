<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>个人中心</title>
    <style>
        body { max-width: 600px; margin: 50px auto; padding: 0 20px; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        .form-item { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input  { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .msg-success { background: #f0f9f0; color: #27ae60; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
        .msg-error   { background: #fef0f0; color: #e74c3c; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
<h1>个人中心</h1>

<div th:if="${message}" th:class="${success ? 'msg-success' : 'msg-error'}" th:text="${message}"></div>

<form th:action="@{/profile/update}" method="post"
      enctype="multipart/form-data" th:object="${user}">
    <input type="hidden" th:field="*{userId}">

    <div class="form-item">
        <label>当前头像</label>
        <img th:src="${user.avatar != null ? user.avatar : '/images/default-avatar.png'}"
             class="avatar-preview" alt="头像">
    </div>
    <div class="form-item">
        <label>更换头像</label>
        <input type="file" name="avatarFile" accept="image/*">
    </div>
    <div class="form-item">
        <label>昵称</label>
        <input type="text" th:field="*{nickname}" required>
    </div>
    <div class="form-item">
        <label>邮箱</label>
        <input type="email" th:field="*{email}" required>
    </div>

    <button type="submit">保存修改</button>
    <a href="/" style="margin-left: 10px;">返回首页</a>
</form>
</body>
</html>
