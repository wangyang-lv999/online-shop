<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文件上传</title>
    <style>
        body { max-width: 600px; margin: 50px auto; padding: 0 20px; }
        .upload-box { border: 2px dashed #ddd; padding: 40px; text-align: center; border-radius: 8px; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #f0f9f0; color: #27ae60; }
        .error   { background: #fef0f0; color: #e74c3c; }
        .image-preview { margin-top: 20px; text-align: center; }
        .image-preview img { max-width: 300px; border-radius: 4px; }
    </style>
</head>
<body>
<h1>文件上传演示</h1>

<!-- 上传结果提示 -->
<div th:if="${message}"
     th:class="${success ? 'result success' : 'result error'}"
     th:text="${message}"></div>

<!-- 上传成功后显示图片预览 -->
<div th:if="${imageUrl}" class="image-preview">
    <h3>上传成功</h3>
    <img th:src="${imageUrl}" alt="上传的图片">
    <p>访问地址：<span th:text="${imageUrl}"></span></p>
</div>

<!-- 关键：必须设置 enctype="multipart/form-data" -->
<form th:action="@{/upload}" method="post" enctype="multipart/form-data">
    <div class="upload-box">
        <input type="file" name="file" accept="image/*" required>
        <p>点击选择图片文件</p>
    </div>
    <button type="submit" style="width:100%; padding:12px; margin-top:20px;
                background:#3498db; color:white; border:none; border-radius:4px; cursor:pointer;">
        上传文件
    </button>
</form>
</body>
</html>
