<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>AJAX 文件上传</title>
    <style>
        body       { max-width: 600px; margin: 50px auto; padding: 0 20px; }
        .upload-box{ border: 2px dashed #ddd; padding: 40px; text-align: center;
            border-radius: 8px; cursor: pointer; }
        .upload-box:hover { border-color: #3498db; }
        .preview   { margin-top: 20px; text-align: center; display: none; }
        .preview img { max-width: 300px; border-radius: 4px; }
    </style>
</head>
<body>
<h1>AJAX 无刷新文件上传</h1>
<div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <p>点击选择图片文件</p>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>
<div class="preview" id="preview">
    <h3>上传成功！</h3>
    <img id="previewImg" alt="预览图">
    <p id="imageUrl" style="font-size:12px; color:#666;"></p>
</div>

<script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file)

        fetch('/api/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('previewImg').src = result.data;
                    document.getElementById('imageUrl').textContent = '访问地址：' + result.data;
                } else {
                    alert('上传失败：' + result.msg);
                }
            });
    });
</script>
</body>
</html>
