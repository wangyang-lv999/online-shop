# 服务器端口配置
server:
  port: 8081


spring:
  application:
    name: shop-admin
  datasource:
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    cache: false # 开发阶段必须关闭缓存，修改页面立即生效
    prefix: classpath:/templates/ # 模板文件根目录（默认）
    suffix: .html # 模板文件后缀（默认）
    encoding: UTF-8
    mode: HTML

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wy.shop.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 表名前缀：和我们的表sys_user、sys_product对应，实体类不用重复写sys_前缀
      table-prefix: sys_
      # 主键自增策略：全局统一主键自增
      id-type: auto

file:
  upload:
    base-path: D:/shop-upload/    # Windows 系统
    # base-path: /opt/shop-upload/ # Linux 系统
    url-prefix: /files/
    max-file-size: 5242880         # 5MB（字节）