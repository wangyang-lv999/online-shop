<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        .header { background: #343a40; color: white; padding: 0 30px; height: 60px;
            display: flex; align-items: center; }
        .header h3 { margin-right: 30px; }
        .nav a { color: white; margin: 0 10px; text-decoration: none; padding: 8px 12px; }
        .nav a:hover { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        th { background: #2c3e50; color: white; }
        tr:hover { background: #f5f5f5; }
        .btn { padding: 4px 10px; color: white; border-radius: 4px;
            text-decoration: none; border: none; cursor: pointer; font-size: 13px; }
        .btn-add  { background: #27ae60; margin-bottom: 20px; display: inline-block; padding: 8px 16px; }
        .btn-edit { background: #3498db; }
        .btn-on   { background: #27ae60; }
        .btn-off  { background: #f39c12; }
        .btn-del  { background: #e74c3c; }
        .cover-img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
        .no-cover  { width: 80px; height: 80px; background: #eee; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: #999; }
        .status-on  { color: #27ae60; font-weight: bold; }
        .status-off { color: #e74c3c; }
    </style>
</head>
<body>
<div class="header">
    <h3>电商后台管理</h3>
    <div class="nav">
        <a href="/admin/user/list">用户管理</a>
        <a href="/admin/product/list">商品管理</a>
    </div>
</div>

<div class="container">
    <a href="/admin/product/add" class="btn btn-add">+ 添加商品</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>商品名称</th>
            <th>价格（元）</th>
            <th>封面图</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${productList}"
            th:with="firstImg=${product.coverImages != null and product.coverImages.length() > 4 ? product.coverImages.split('&quot;')[1] : null}">
            <td th:text="${product.productId}">1</td>
            <td th:text="${product.productName}">商品名称</td>
            <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}">99.00</td>
            <td>
                <img th:if="${firstImg != null}"
                     th:src="${firstImg}"
                     class="cover-img" alt="封面">
                <div th:unless="${firstImg != null}" class="no-cover">无封面</div>
            </td>
            <td>
                <span th:class="${product.status == 1 ? 'status-on' : 'status-off'}"
                      th:text="${product.status == 1 ? '上架' : '下架'}"></span>
            </td>
            <td>
                <a class="btn btn-edit"
                   th:href="@{/admin/product/edit/{id}(id=${product.productId})}">编辑</a>

                <!-- 上架/下架切换 -->
                <a th:class="${product.status == 1 ? 'btn btn-off' : 'btn btn-on'}"
                   th:href="@{/admin/product/status/{id}/{s}(id=${product.productId}, s=${product.status == 1 ? 0 : 1})}">
                    <span th:text="${product.status == 1 ? '下架' : '上架'}"></span>
                </a>

                <a class="btn btn-del"
                   th:href="@{/admin/product/delete/{id}(id=${product.productId})}"
                   onclick="return confirm('确定删除该商品？')">删除</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productList)}">
            <td colspan="6" style="text-align:center; color:#999; padding:30px;">暂无商品数据</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
