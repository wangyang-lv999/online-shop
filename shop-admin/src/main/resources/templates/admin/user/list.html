<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        .header {
            background: #343a40; color:white; padding: 0 30px; height:60px;
            display: flex; align-items:center;
        }
        .header h3 { margin-right: 30px; }
        .nav a { color:white; margin:0 10px; text-decoration:none; padding:8px 12px; }
        .container { max-width:1200px; margin:30px auto; padding:20px; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th,td { border:1px solid #ddd; padding:10px; text-align:left; }
        th { background:#2c3e50; color:white; }
        .btn { padding:4px 10px; color:white; border-radius:4px; text-decoration:none; }
        .edit { background:#3498db; }
        .del { background:#e74c3c; }
    </style>
</head>
<body>
<div class="header">
    <h3>电商后台管理</h3>
    <div class="nav">
        <a href="/admin/user/list">用户管理</a>
        <a href="javascript:;">商品管理</a>
    </div>
</div>

<div class="container">
    <h3>用户列表</h3>
    <table>
        <tr>
            <th>序号</th><th>ID</th><th>用户名</th><th>昵称</th><th>年龄</th><th>邮箱</th><th>状态</th><th>操作</th>
        </tr>
        <tr th:each="user,stat : ${userList}">
            <td>[[${stat.count}]]</td>
            <td>[[${user.userId}]]</td>
            <td>[[${user.username}]]</td>
            <td>[[${user.nickname}]]</td>
            <td>[[${user.age}]]</td>
            <td>[[${user.email}]]</td>
            <td th:style="${user.status==1 ? 'color:#27ae60' : 'color:#e74c3c'}">
                [[${user.status==1 ? '正常' : '禁用'}]]
            </td>
            <td>
                <!-- 编辑按钮 -->
                <a class="btn edit" th:href="@{/admin/user/edit/{userId}(userId=${user.userId})}">编辑</a>

                <!-- 删除按钮 -->
                <a class="btn del" th:href="@{/admin/user/delete/{userId}(userId=${user.userId})}"
                   onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(userList)}">
            <td colspan="8" style="text-align:center;">暂无数据</td>
        </tr>
    </table>
</div>
</body>
</html>
